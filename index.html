<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>For Dĩnh</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page" aria-label="Flower note page">
      <section class="note-sheet" aria-labelledby="dedication">
        <h1 id="dedication" class="dedication">For Dĩnh &lt;3</h1>

        <div class="side-hearts" aria-hidden="true">
          <span class="heart side-heart side-heart-left-one"></span>
          <span class="heart side-heart side-heart-left-two"></span>
          <span class="heart side-heart side-heart-right-one"></span>
          <span class="heart side-heart side-heart-right-two"></span>
        </div>

        <div class="flower-scene" aria-hidden="true">
          <div class="hearts">
            <span class="heart heart-one"></span>
            <span class="heart heart-two"></span>
            <span class="heart heart-three"></span>
            <span class="heart heart-four"></span>
            <span class="heart heart-five"></span>
          </div>
          <img
            class="bouquet"
            src="bouquet.svg"
            width="310"
            height="420"
            alt=""
          />
        </div>

        <div class="message-area" aria-live="polite">
          <p class="message">
            <span class="message-text" id="message-text">Quà cho Dĩnh ngốc</span>
          </p>
          <p class="tiny-note">with you, all is ok</p>
        </div>
      </section>
    </main>
  </body>
</html>
